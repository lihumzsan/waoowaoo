x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: waoowaoo-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-waoowaoo}"
      MYSQL_USER: "${MYSQL_USER:-waoowaoo}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: waoowaoo-redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ==================== MinIO ====================
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: waoowaoo-minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
    command: server /data --console-address ":9001"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-19000}:9000"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ==================== App (Next.js + Workers) ====================
  app:
    image: ghcr.io/saturndec/waoowaoo:latest
    container_name: waoowaoo-app
    restart: unless-stopped
    logging: *default-logging
    environment:
      # 数据库（指向容器内部 MySQL，用服务名 mysql 而非 localhost）
      DATABASE_URL: "${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env; use the mysql service hostname}"
      # Redis（指向容器内部 Redis，用服务名 redis）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      REDIS_TLS: ""
      # 存储：默认 MinIO（S3 兼容）
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_REGION: "us-east-1"
      MINIO_BUCKET: "waoowaoo"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
      MINIO_FORCE_PATH_STYLE: "true"
      # 外部访问地址（浏览器实际访问）
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:13000}"
      # 容器内自调用地址（服务端 fetch 自己的 API / 文件）
      INTERNAL_APP_URL: "http://127.0.0.1:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
      # 内部密钥
      CRON_SECRET: "${CRON_SECRET:?Set CRON_SECRET in .env}"
      API_ENCRYPTION_KEY: "${API_ENCRYPTION_KEY:?Set API_ENCRYPTION_KEY in .env}"
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-0}"
      # Worker 配置
      QUEUE_CONCURRENCY_IMAGE: "50"
      QUEUE_CONCURRENCY_VIDEO: "50"
      QUEUE_CONCURRENCY_MUSIC: "50"
      QUEUE_CONCURRENCY_VOICE: "50"
      QUEUE_CONCURRENCY_TEXT: "50"
      # Bull Board
      BULL_BOARD_HOST: "0.0.0.0"
      BULL_BOARD_PORT: "3010"
      BULL_BOARD_BASE_PATH: "/admin/queues"
      BULL_BOARD_USER: "${BULL_BOARD_USER:?Set BULL_BOARD_USER in .env}"
      BULL_BOARD_PASSWORD: "${BULL_BOARD_PASSWORD:?Set BULL_BOARD_PASSWORD in .env}"
      # 日志
      LOG_UNIFIED_ENABLED: "true"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      LOG_DEBUG_ENABLED: "false"
      LOG_AUDIT_ENABLED: "true"
      LOG_SERVICE: "waoowaoo"
      LOG_REDACT_KEYS: "password,token,apiKey,apikey,authorization,cookie,secret,access_token,refresh_token"
      # 计费
      DEPLOYMENT_EDITION: "self-hosted"
      PROVIDER_CREDENTIAL_MODE: "user-key"
      BILLING_MODE: "OFF"
      # 流式
      LLM_STREAM_EPHEMERAL_ENABLED: "true"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-13000}:3000"
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${BULL_BOARD_HOST_PORT:-13010}:3010"
    volumes:
      - ./data:/app/data
      - ./docker-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        npm run db:push &&
        (sleep 5 && echo '' &&
        echo '╔══════════════════════════════════════════════════╗' &&
        echo '║            waoowaoo is ready!                    ║' &&
        echo '║                                                  ║' &&
        echo '║  HTTP:  http://localhost:13000                    ║' &&
        echo '║                                                  ║' &&
        echo '║  For HTTPS, run Caddy on host:                   ║' &&
        echo '║  caddy run --config Caddyfile                    ║' &&
        echo '║  Then open: https://localhost:1443                ║' &&
        echo '╚══════════════════════════════════════════════════╝' &&
        echo '') &
        npm run start
      "

volumes:
  mysql_data:
  redis_data:
  minio_data:
