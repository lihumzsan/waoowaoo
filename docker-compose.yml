x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-environment: &app-environment
  # Application database. Temporal owns separate schemas and never uses this URL.
  DATABASE_URL: "${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env; use the mysql service hostname}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
  REDIS_TLS: ""
  S3_ENDPOINT: "${S3_ENDPOINT:?Set the public HTTPS S3-compatible endpoint in .env}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET in .env}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}"
  S3_SESSION_TOKEN: "${S3_SESSION_TOKEN:-}"
  S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
  NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:13000}"
  INTERNAL_APP_URL: "http://app:3000"
  NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
  CRON_SECRET: "${CRON_SECRET:?Set CRON_SECRET in .env}"
  API_ENCRYPTION_KEY: "${API_ENCRYPTION_KEY:?Set API_ENCRYPTION_KEY in .env}"
  TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-0}"
  LOG_UNIFIED_ENABLED: "true"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  LOG_DEBUG_ENABLED: "${LOG_DEBUG_ENABLED:-false}"
  LOG_AUDIT_ENABLED: "${LOG_AUDIT_ENABLED:-true}"
  LOG_SERVICE: "waoowaoo"
  DEPLOYMENT_EDITION: "self-hosted"
  PROVIDER_CREDENTIAL_MODE: "user-key"
  BILLING_MODE: "OFF"
  LLM_STREAM_EPHEMERAL_ENABLED: "${LLM_STREAM_EPHEMERAL_ENABLED:-true}"
  TEMPORAL_ADDRESS: "temporal:7233"
  TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-waoowaoo}"
  TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-waoowaoo-runtime}"
  TEMPORAL_API_KEY: ""
  TEMPORAL_TLS_ENABLED: "false"
  TEMPORAL_WORKER_DEPLOYMENT_NAME: "${TEMPORAL_WORKER_DEPLOYMENT_NAME:-waoowaoo}"
  TEMPORAL_WORKER_BUILD_ID: "${TEMPORAL_WORKER_BUILD_ID:?Set an immutable Temporal Worker release build ID}"
  TEMPORAL_WORKER_VERSIONING_ENABLED: "${TEMPORAL_WORKER_VERSIONING_ENABLED:?Set TEMPORAL_WORKER_VERSIONING_ENABLED=true}"

x-app-service: &app-service
  image: "${APP_IMAGE:-ghcr.io/saturndec/waoowaoo:latest}"
  restart: unless-stopped
  logging: *default-logging
  environment: *app-environment
  volumes:
    - ./data:/app/data
    - ./docker-logs:/app/logs
  depends_on:
    mysql:
      condition: service_healthy
    app-schema:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    temporal-create-namespace:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-waoowaoo}"
      MYSQL_USER: "${MYSQL_USER:-waoowaoo}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # One explicit application-schema writer prevents Web and Worker races.
  # This is retained for the current self-hosted release contract; production
  # deployments should run the reviewed migration before replacing the image.
  app-schema:
    image: "${APP_IMAGE:-ghcr.io/saturndec/waoowaoo:latest}"
    restart: "no"
    logging: *default-logging
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    command: ["npm", "run", "db:push"]

  temporal-db-bootstrap:
    image: mysql:8.0
    restart: "no"
    logging: *default-logging
    network_mode: "service:mysql"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      TEMPORAL_MYSQL_USER: "${TEMPORAL_MYSQL_USER:-temporal}"
      TEMPORAL_MYSQL_PASSWORD: "${TEMPORAL_MYSQL_PASSWORD:?Set TEMPORAL_MYSQL_PASSWORD in .env}"
    volumes:
      - ./scripts/temporal/bootstrap-mysql.sh:/scripts/bootstrap-mysql.sh:ro
    entrypoint: ["/bin/sh", "/scripts/bootstrap-mysql.sh"]

  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    logging: *default-logging
    depends_on:
      temporal-db-bootstrap:
        condition: service_completed_successfully
    environment:
      MYSQL_SEEDS: mysql
      MYSQL_USER: "${TEMPORAL_MYSQL_USER:-temporal}"
      SQL_PASSWORD: "${TEMPORAL_MYSQL_PASSWORD:?Set TEMPORAL_MYSQL_PASSWORD in .env}"
      DB_PORT: "3306"
    volumes:
      - ./scripts/temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]

  temporal:
    image: temporalio/server:1.31.2
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: mysql8
      DB_PORT: "3306"
      MYSQL_SEEDS: mysql
      MYSQL_USER: "${TEMPORAL_MYSQL_USER:-temporal}"
      MYSQL_PWD: "${TEMPORAL_MYSQL_PASSWORD:?Set TEMPORAL_MYSQL_PASSWORD in .env}"
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/waoowaoo.yaml
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${TEMPORAL_HOST_PORT:-17233}:7233"
    volumes:
      - ./scripts/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/waoowaoo.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    logging: *default-logging
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-waoowaoo}"
      TEMPORAL_NAMESPACE_RETENTION: "${TEMPORAL_NAMESPACE_RETENTION:-30d}"
    volumes:
      - ./scripts/temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:2.49.1
    profiles: ["temporal-ui"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "${NEXTAUTH_URL:-http://localhost:13000}"
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-18080}:8080"

  app:
    <<: *app-service
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-13000}:3000"
    command: ["sh", "-c", "npm run storage:init && exec npm run start:next"]

  temporal-worker:
    <<: *app-service
    command: ["sh", "-c", "npm run storage:init && exec npm run start:temporal-worker"]

volumes:
  mysql_data:
  redis_data:
