x-dev-environment: &dev-environment
  NODE_ENV: development
  DATABASE_URL: "${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in the selected development env file}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the selected development env file}"
  REDIS_TLS: ""
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-waoowaoo}"
  TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-waoowaoo-runtime}"
  TEMPORAL_TLS_ENABLED: "false"
  TEMPORAL_API_KEY: ""
  TEMPORAL_WORKER_BUILD_ID: local
  TEMPORAL_WORKER_VERSIONING_ENABLED: "false"
  INTERNAL_APP_URL: http://app:3000
  CODEX_RUNTIME_DRIVER: docker
  CODEX_RUNTIME_HOST_ROOT: "${WAO_DEV_CODEX_RUNTIME_ROOT:?Set WAO_DEV_CODEX_RUNTIME_ROOT through scripts/dev-docker.sh}"
  CODEX_RUNTIME_WAO_BASE_URL: http://app:3000
  CODEX_RUNTIME_IMAGE: waoowaoo-codex-runtime:development
  CODEX_RUNTIME_NETWORK: "${COMPOSE_PROJECT_NAME:-waoowaoo}_codex-runtime"
  CODEX_RUNTIME_CPU_LIMIT: "${CODEX_RUNTIME_CPU_LIMIT:-2}"
  CODEX_RUNTIME_MEMORY_BYTES: "${CODEX_RUNTIME_MEMORY_BYTES:-2147483648}"
  CODEX_RUNTIME_PIDS_LIMIT: "${CODEX_RUNTIME_PIDS_LIMIT:-256}"

x-dev-service: &dev-service
  image: waoowaoo-development:local
  build:
    context: .
    target: development
  restart: "no"
  env_file:
    - .env
    - "${WAO_DEV_ENV_OVERLAY:-.env}"
  environment: *dev-environment
  volumes:
    - .:/app
    - dev_node_modules:/app/node_modules
    - dev_next:/app/.next
    - ./data:/app/data
    - ./docker-logs:/app/logs
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    temporal-create-namespace:
      condition: service_completed_successfully

services:
  codex-runtime-dev:
    image: waoowaoo-codex-runtime:development
    build:
      context: .
      dockerfile: Dockerfile.codex-runtime
    profiles: ["dev-build"]

  app-schema-dev:
    <<: *dev-service
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma generate && npm run db:push"]

  app-dev:
    <<: *dev-service
    ports:
      - "${DEV_APP_BIND_ADDRESS:-127.0.0.1}:${DEV_APP_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
      - ./data:/app/data
      - ./docker-logs:/app/logs
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - type: bind
        source: "${WAO_DEV_CODEX_RUNTIME_ROOT:?Set WAO_DEV_CODEX_RUNTIME_ROOT through scripts/dev-docker.sh}"
        target: "${WAO_DEV_CODEX_RUNTIME_ROOT:?Set WAO_DEV_CODEX_RUNTIME_ROOT through scripts/dev-docker.sh}"
    networks:
      default:
        aliases: [app]
      codex-runtime:
        aliases: [app]
    depends_on:
      app-schema-dev:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    command: ["sh", "-c", "npm run storage:init && exec npm run dev:next"]

  temporal-worker-dev:
    <<: *dev-service
    depends_on:
      app-schema-dev:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    command: ["npm", "run", "dev:temporal-worker"]

volumes:
  dev_node_modules:
  dev_next:
