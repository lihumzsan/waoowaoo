name: Verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      TEST_IMPACT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TEST_IMPACT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
      CI_MYSQL_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret
      INTERNAL_APP_URL: http://127.0.0.1:3000
      CRON_SECRET: ci-cron-secret
      INTERNAL_TASK_TOKEN: ci-internal-task-token
      API_ENCRYPTION_KEY: waoowaoo-opensource-fixed-key-2026
      STORAGE_TYPE: local
      DEPLOYMENT_EDITION: self-hosted
      PROVIDER_CREDENTIAL_MODE: user-key
      BILLING_MODE: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve test impact range
        shell: bash
        run: |
          base="$TEST_IMPACT_BASE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          git cat-file -e "${TEST_IMPACT_HEAD_SHA}^{commit}"
          printf 'TEST_IMPACT_BASE_SHA=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure test database URL
        run: |
          printf 'DATABASE_URL=%s%s%s\n' 'mysql://root:' "$CI_MYSQL_PASSWORD" '@127.0.0.1:3307/waoowaoo_test' >> "$GITHUB_ENV"

      - name: Secret scan
        run: npm run security:secrets:repo

      - name: Full verification
        run: npm run verify:push
